# Superposicion para levantar el despliegue en el equipo (2026-10-27B, D;
# 2026-10-27C, DK):
#
#   docker compose -f infra/compose.yaml -f infra/compose.local.yaml --env-file infra/entorno.local.ejemplo up -d
#
# El borde publica solo el 8080 y sirve HTTP sin TLS (HOPPIT_DOMINIO=":80"
# en el archivo de entorno local). Las imagenes se construyen en el equipo con
# la etiqueta "local" y no se publican.
#
# Los datos van en volumenes de Docker con nombre, no en carpetas de Windows
# montadas: SQLite en modo WAL sobre un montaje desde el sistema de archivos
# de Windows puede fallar por los bloqueos de archivo. En la maquina de Azure
# siguen los montajes de directorio sobre su disco de datos (seccion 1.3).
# Las claves de firma siguen llegando como secretos de Compose desde
# HOPPIT_RAIZ_DE_DATOS/secretos: son archivos de solo lectura.
services:
  borde:
    ports: !override
      - "8080:80"
    volumes: !override
      - caddy_datos:/data
      - caddy_config:/config

  nucleo:
    volumes: !override
      - datos_nucleo:/var/lib/hoppit/nucleo

  telemetria:
    volumes: !override
      - datos_telemetria:/var/lib/hoppit/telemetria

volumes:
  caddy_datos: {}
  caddy_config: {}
  datos_nucleo: {}
  datos_telemetria: {}
